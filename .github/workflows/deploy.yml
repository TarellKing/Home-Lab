name: deploy-honeynet

# Manually triggered. Applies the platform layer then the honeynet layer, or
# destroys them in the reverse order. Authenticates to AWS with GitHub OIDC --
# no static AWS keys are stored in the repo.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]
      aws_region:
        description: "AWS region"
        type: string
        required: true
        default: us-east-1

permissions:
  contents: read
  id-token: write # required for OIDC

concurrency:
  group: honeynet-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  PLATFORM_KEY: honeynet/platform/dev.tfstate
  HONEYNET_KEY: honeynet/honeynet/dev.tfstate

jobs:
  terraform:
    runs-on: ubuntu-latest
    # Using this environment makes the OIDC subject
    # repo:OWNER/REPO:environment:honeynet-dev, which the deploy role trusts.
    environment: honeynet-dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Init platform
        run: |
          terraform -chdir=terraform/layers/platform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=$PLATFORM_KEY" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Init honeynet
        run: |
          terraform -chdir=terraform/layers/honeynet init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=$HONEYNET_KEY" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Validate
        run: |
          terraform -chdir=terraform/layers/platform validate
          terraform -chdir=terraform/layers/honeynet validate

      # honeynet needs to know where the platform state lives + its region.
      - name: Export honeynet vars
        run: |
          echo "TF_VAR_aws_region=${{ inputs.aws_region }}" >> "$GITHUB_ENV"
          echo "TF_VAR_platform_state_bucket=${{ secrets.TF_STATE_BUCKET }}" >> "$GITHUB_ENV"
          echo "TF_VAR_platform_state_key=$PLATFORM_KEY" >> "$GITHUB_ENV"

      # ---- plan ----
      - name: Plan platform
        if: inputs.action == 'plan'
        run: terraform -chdir=terraform/layers/platform plan -input=false -var="aws_region=${{ inputs.aws_region }}"
      - name: Plan honeynet
        if: inputs.action == 'plan'
        run: terraform -chdir=terraform/layers/honeynet plan -input=false

      # ---- apply: platform first, then honeynet ----
      - name: Apply platform
        if: inputs.action == 'apply'
        run: terraform -chdir=terraform/layers/platform apply -auto-approve -input=false -var="aws_region=${{ inputs.aws_region }}"
      - name: Apply honeynet
        if: inputs.action == 'apply'
        run: terraform -chdir=terraform/layers/honeynet apply -auto-approve -input=false

      - name: Show honeynet outputs
        if: inputs.action == 'apply'
        run: terraform -chdir=terraform/layers/honeynet output

      # ---- destroy: honeynet first, then platform ----
      - name: Destroy honeynet
        if: inputs.action == 'destroy'
        run: terraform -chdir=terraform/layers/honeynet destroy -auto-approve -input=false
      - name: Destroy platform
        if: inputs.action == 'destroy'
        run: terraform -chdir=terraform/layers/platform destroy -auto-approve -input=false -var="aws_region=${{ inputs.aws_region }}"
