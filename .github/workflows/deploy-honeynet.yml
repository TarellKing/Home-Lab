name: deploy-honeynet

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]
      aws_region:
        description: "AWS region"
        type: string
        required: true
        default: us-east-1

permissions:
  contents: read
  id-token: write

concurrency:
  group: honeynet-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_DIR: terraform/environments/dev

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: honeynet-dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Terraform init
        run: |
          terraform -chdir=$TF_DIR init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=cloud-honeynet-mini-techco/dev.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform fmt check
        run: terraform -chdir=$TF_DIR fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=$TF_DIR validate

      - name: Terraform plan
        if: inputs.action == 'plan'
        run: terraform -chdir=$TF_DIR plan -input=false

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform -chdir=$TF_DIR apply -input=false -auto-approve

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform -chdir=$TF_DIR destroy -input=false -auto-approve
