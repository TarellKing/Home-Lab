name: scheduled-teardown

# Automatically tears down the DISPOSABLE honeynet layer (EC2 + security group)
# on a schedule, so a forgotten honeypot never sits exposed or billing overnight.
# The PLATFORM layer (log groups, IAM) is left alone -- history persists, and a
# later `deploy-honeynet` apply brings the lab straight back.
#
# Two knobs:
#   * the cron below (times are UTC)
#   * scope: this workflow destroys honeynet only. To also drop the platform
#     layer, run the `deploy-honeynet` workflow with action=destroy instead.
on:
  schedule:
    # 06:00 UTC daily = 02:00 America/New_York (EDT). Adjust to taste.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # also runnable on demand

permissions:
  contents: read
  id-token: write

concurrency:
  group: honeynet-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1
  PLATFORM_KEY: honeynet/platform/dev.tfstate
  HONEYNET_KEY: honeynet/honeynet/dev.tfstate

jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: honeynet-dev # OIDC subject the deploy role trusts
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init honeynet
        run: |
          terraform -chdir=terraform/layers/honeynet init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=$HONEYNET_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Destroy honeynet (keep platform + logs)
        env:
          # honeynet reads the platform layer's state even during destroy.
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_platform_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_platform_state_key: ${{ env.PLATFORM_KEY }}
        run: terraform -chdir=terraform/layers/honeynet destroy -auto-approve -input=false
