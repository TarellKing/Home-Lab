# =============================================================================
# Redis honeypot config -- DELIBERATELY UNAUTHENTICATED.
# =============================================================================
# The classic exposed-Redis mistake: bound to all interfaces, no password, and
# protected-mode off. Attackers can read/write keys freely and typically try
# the CONFIG SET dir + SAVE cron-write persistence trick.

bind 0.0.0.0
protected-mode no
port 6379

# No requirepass on purpose.

# Log to a file so the CloudWatch agent tails it into the persistent group.
logfile /var/log/redis/redis.log
loglevel notice
