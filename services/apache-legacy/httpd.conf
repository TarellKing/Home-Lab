# =============================================================================
# Apache httpd 2.4.49 -- DELIBERATELY VULNERABLE config for CVE-2021-41773.
# =============================================================================
# The dangerous parts vs a safe default:
#   * `<Directory />` is `Require all granted` instead of `Require all denied`.
#     In 2.4.49 this is exactly what lets an encoded ../ traversal escape the
#     document root.
#   * mod_cgi + a ScriptAlias are enabled, which turns that traversal into
#     remote code execution (e.g. POST to /cgi-bin/ via ...%2e/bin/sh).
# This file only belongs on a throwaway honeypot. Never on anything real.

ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule alias_module modules/mod_alias.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule cgid_module modules/mod_cgid.so

User daemon
Group daemon

# --- the misconfiguration -----------------------------------------------------
# Permissive root directory policy: this is the CVE-2021-41773 trigger.
<Directory />
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# CGI enabled -> traversal becomes RCE.
ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
<Directory "/usr/local/apache2/cgi-bin">
    AllowOverride None
    Options None
    Require all granted
</Directory>

DirectoryIndex index.html

TypesConfig conf/mime.types

# --- logging ------------------------------------------------------------------
# Write to files (not just stdout) so the CloudWatch agent tails them and they
# land in the persistent /honeynet/<env>/service/apache-legacy/{access,error}
# log groups.
ErrorLog logs/error_log
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog logs/access_log combined
